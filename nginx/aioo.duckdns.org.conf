# aioo.duckdns.org — 工具矩阵主站
# 用法: sudo cp aioo.duckdns.org.conf /etc/nginx/sites-available/aioo.duckdns.org
#       sudo ln -s /etc/nginx/sites-available/aioo.duckdns.org /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# 网站根目录按你的实际路径改（下面示例 /var/www/aioo.duckdns.org）
# HTTPS: sudo certbot --nginx -d aioo.duckdns.org（一键配证书；已有证书可跳过）

server {
    listen 80;
    server_name aioo.duckdns.org;

    root /var/www/aioo.duckdns.org/public;
    index index.html;
    charset utf-8;

    # 静态资源强缓存（带 hash 文件名时）；HTML 只缓存 5 分钟
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # API 缓存代理（本机 Node，见 ../api-proxy）；前端不再直连第三方 API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
