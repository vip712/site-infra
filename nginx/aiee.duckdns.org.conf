# aiee.duckdns.org — 返佣测评站（费率对比 / 提现手续费对比 / 交易所测评）
# 用法同 aioo.duckdns.org.conf（复制、建软链、nginx -t、reload）
# HTTPS: sudo certbot --nginx -d aiee.duckdns.org

server {
    listen 80;
    server_name aiee.duckdns.org;

    root /var/www/aiee.duckdns.org/public;
    index index.html;
    charset utf-8;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # 费率对比页需要实时数据，走同一台缓存代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
