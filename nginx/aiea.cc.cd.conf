# aiea.cc.cd — 英文站（源站在 Vultr，Cloudflare 做 CDN）
# 这是源站 vhost（放在 Vultr 的 Nginx 上），Cloudflare 那边 SSL 模式用 "Full (strict)"
# 用法同 aioo.duckdns.org.conf；证书：源站可用 certbot 配，或 Cloudflare Origin CA 证书
#
# Cloudflare 缓存注意（开发期）：
#  在 Cloudflare 建一条 Cache Rule：当 URL 以 .html 结尾或路径为 / 时 → Bypass cache
#  （避免改完页面用户还看到旧版）。以后稳定了再改回短缓存。
#  真要让 Muse 帮你清缓存：Cloudflare 建一个只有 "Cache Purge" 权限的 API token 再说。

server {
    listen 80;
    server_name aiea.cc.cd;

    root /var/www/aiea.cc.cd/public;
    index index.html;
    charset utf-8;

    # Cloudflare 会再缓存一层，这里给静态资源长缓存、HTML 短缓存即可
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
