# aiia.duckdns.org — 待定（提议：AI 研报 / 深度内容站，见 README）
# 用法同 aioo.duckdns.org.conf（复制、建软链、nginx -t、reload）
# HTTPS: sudo certbot --nginx -d aiia.duckdns.org
# 注意：这是 repurpose，原吉源官网内容已由 Tony 确认废弃（2026-10-07）

server {
    listen 80;
    server_name aiia.duckdns.org;

    root /var/www/aiia.duckdns.org/public;
    index index.html;
    charset utf-8;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
